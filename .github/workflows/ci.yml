name: Build, test and refresh results

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "experiments/results/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "experiments/results/**"

# Default for every job: read-only. Only the publish job below can write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build, run C tests, experiments and Python tests
        run: make test
      - name: Keep generated results for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: experiment-results
          path: |
            experiments/results/*.csv
            experiments/results/*.md
            experiments/results/plots/
          retention-days: 7

  # Commits regenerated results back to main. Runs only after the tests pass,
  # only for pushes to main (never for pull requests), and is the only job
  # with write access to the repository.
  publish-results:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: experiment-results
          path: experiments/results
      - name: Commit refreshed results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/results/*.csv experiments/results/*.md experiments/results/plots/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh experiment results"
            git push
          fi
