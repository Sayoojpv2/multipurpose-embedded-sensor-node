name: Build, test and refresh results

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "experiments/results/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "experiments/results/**"

permissions:
  contents: write

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build, run C tests, experiments and Python tests
        run: make test
      - name: Refresh checked-in experiment outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/results/aggregate.csv \
                  experiments/results/metrics.csv \
                  experiments/results/profiles.json \
                  experiments/results/relative_vs_fixed.csv \
                  experiments/results/results_summary.md \
                  experiments/results/sweep_loss.csv \
                  experiments/results/sweep_stable.csv \
                  experiments/results/plots/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh experiment results"
            git push
          fi
